name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  packageName: "com.elypha.unity-toolkit"
  pagesRepo: "Elypha/unity-packages"

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: "true"
          fetch-depth: 0

      - name: Prepare package information
        id: info
        run: |
          packageVersion=$(jq -r '.version' package.json)
          echo "packageVersion=${packageVersion}" >> $GITHUB_OUTPUT
          echo "zipName=${{ env.packageName }}-${packageVersion}.zip" >> $GITHUB_OUTPUT
          echo "unitypackageName=${{ env.packageName }}-${packageVersion}.unitypackage" >> $GITHUB_OUTPUT

      - name: Set metadata list
        run: find ./ -name \*.meta >> metaList

      - name: Create .unitypackage
        uses: pCYSl5EDgo/create-unitypackage@b5c57408698b1fab8b3a84d4b67f767b8b7c0be9
        with:
          package-path: ${{ steps.info.outputs.unitypackageName }}
          include-files: metaList

      - name: Create zip
        run: |
          zip -r "${{ steps.info.outputs.zipName }}" . \
            -x ".git/*" ".github/*" "metaList" "RELEASE_NOTES.md" \
               "${{ steps.info.outputs.zipName }}" \
               "${{ steps.info.outputs.unitypackageName }}"

      - name: Generate VPM release manifest
        run: |
          zipSHA256=$(sha256sum "${{ steps.info.outputs.zipName }}" | cut -d ' ' -f 1)
          releaseUrl="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.info.outputs.zipName }}"
          jq --arg repository "$GITHUB_REPOSITORY" \
             --arg tag "$GITHUB_REF_NAME" \
             --arg asset "${{ steps.info.outputs.zipName }}" \
             --arg url "$releaseUrl" \
             --arg hash "$zipSHA256" \
             '{schemaVersion: 1, source: {repository: $repository, tag: $tag, asset: $asset}, package: (.url = $url | .zipSHA256 = $hash)}' \
             package.json > vpm-release.json

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Make Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.info.outputs.zipName }}
            ${{ steps.info.outputs.unitypackageName }}
            package.json
            vpm-release.json

      - name: Dispatch Pages listing ingestion
        env:
          GH_TOKEN: ${{ secrets.PAT_PAGES_REBUILD }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ env.pagesRepo }}/actions/workflows/build-listing.yml/dispatches" \
            -f ref=master \
            -f "inputs[source_repository]=${SOURCE_REPOSITORY}" \
            -f "inputs[release_tag]=${RELEASE_TAG}"
